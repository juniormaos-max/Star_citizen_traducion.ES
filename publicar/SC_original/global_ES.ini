escort_scan_danger_003=Advertencia, esta es una ruta peligrosa con una alta probabilidad de contacto con forajidos. Prepárate en consecuencia. ~mission(Contractor) está dispuesto a ofrecer un pago competitivo por eficacia en combate.
escort_scan_desc_0001=~mission(Contractor) está buscando contratistas disponibles para encontrarse lo más pronto posible con un ~mission(Client) y escoltarlos a ~mission(EscortNum). ~mission(Danger)El pago se transferirá tras el regreso seguro del ~mission(Client).
escort_scan_desc_0002=SE CONTRATA PARA COMENZAR DE INMEDIATO\n\nBuscamos ~mission(EscortType) para proteger a un ~mission(Client) mientras viajan a ~mission(EscortNum). ~mission(Danger)El pago se certificará a través de ~mission(Contractor) y se transferirá al completar la misión.
escort_scan_desc_0003=SE NECESITA ESCOLTA ARMADA. ~mission(Contractor) busca pilotos para encontrarse con un ~mission(Client) en ~mission(location) y protegerlos en su viaje a ~mission(EscortNum). ~mission(Danger)El pago se transferirá al completar el contrato. El ~mission(Client) ya está en camino hacia el punto de encuentro, así que se aprecia la puntualidad.
escort_scan_desc_0004=~mission(Contractor) quiere contratar una escolta para proteger a un ~mission(Client) mientras viajan a ~mission(EscortNum). Solicitantes profesionales y puntuales solamente. Preséntate a tiempo y prepárate para trabajar. El pago se realizará al finalizar el trabajo. ~mission(Danger)
escort_scan_desc_0005=~mission(Contractor) ha estado realizando operaciones de escaneo en el sistema y necesita pilotos para actuar como un detalle de protección para un ~mission(Client). Las escoltas se encontrarán con el cliente en ~mission(Location) y los acompañarán mientras realizan un reconocimiento en ~mission(EscortNum). Si eres contratado, debes estar listo para presentarte de inmediato. ~mission(Danger)El pago se transferirá cuando se complete el trabajo y el ~mission(Client) esté a salvo.
escort_scan_from=~mission(Contractor)
