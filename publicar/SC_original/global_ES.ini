PU_MTSECRREP01_F_DEH_Accepted_Mission_aAlly_tPlayer_FromAlly_ExpVet_IG_003_MyNamesMarques=Soy Marques y seré tu contacto en MT Protection Services. Veo que este no es ni de lejos tu primer trabajo con nosotros. Me alegro de tenerte de vuelta y, sinceramente, me alegra no tener que llevarte de la mano. Últimamente he tratado con muchos novatos. En fin, te dejo trabajar. Te envío los detalles del encargo ahora.
dfm_ac_ui_NotificationPartyInviteMessage=%s te ha invitado a unirte a un juego. Pulsa ~action(ui_notification|ui_notification_accept) para unirte o ~action(ui_notification|ui_notification_decline) para rechazar.
iae2953_sign_mining_reardiorama_body=Localiza y extrae recursos de depósitos minerales ricos en el espacio o en las superficies planetarias con una nave de minería. Diseñadas para profesionales, pero a menudo lo bastante intuitivas para quienes empiezan, estas naves cuentan con escaneo de precisión, amplio espacio de carga y láseres de minería personalizables. Ya sea minando en solitario o reventando un depósito enorme con otros, las naves de minería son el principal método de extracción de recursos del imperio.
items_commodities_special_lunar_envelope_1_ram_a_desc=Un sobre rojo dorado que celebra el Año del Carnero. Intercambiar estos sobres es una de las formas más populares de celebrar el Red Festival. A menudo el sobre incluye una pequeña cantidad de créditos para ayudar a tus seres queridos a empezar con fuerza el próximo ciclo. Cada vez es más popular la nueva tradición de esconder los sobres para repartir buena fortuna y prosperidad a quienes el destino considere necesitados.
items_commodities_special_lunar_envelope_1_rooster_a_desc=Un sobre rojo dorado que celebra el Año del Gallo. Intercambiar estos sobres es una de las formas más populares de celebrar el Red Festival. A menudo el sobre incluye una pequeña cantidad de créditos para ayudar a tus seres queridos a empezar con fuerza el próximo ciclo. Cada vez es más popular la nueva tradición de esconder los sobres para repartir buena fortuna y prosperidad a quienes el destino considere necesitados. \n\nGuarda el sobre como amuleto de suerte, compártelo con un amigo o un ser querido para repartir buena fortuna, o cámbialo en una terminal de mercancías y usa los créditos para un próspero comienzo de ciclo.
items_commodities_special_lunar_envelope_desc=Un sobre rojo dorado que celebra el Año del Caballo. Intercambiar estos sobres dorados es una de las formas más populares de celebrar el Red Festival. A menudo el sobre incluye una pequeña cantidad de créditos para ayudar a tus seres queridos a empezar con fuerza el próximo ciclo. Cada vez es más popular la nueva tradición de esconder los sobres para repartir buena fortuna y prosperidad a quienes el destino considere necesitados.
items_commodities_sulfermoss_desc=Se encuentra cerca de respiraderos cálidos. Esta alga se alimenta del suelo planetario rico en nutrientes pero extremadamente duro, disolviendo lentamente capas de roca.\n\nCrece en grandes parches texturizados que podrían parecer vastas llanuras herbosas.
items_commodities_sunsetberry_desc=NDR: 08\nHEI: 06\nEfecto: Tóxico\n\nEstas bayas de tonos ocaso crecen mejor en climas fríos. Son tóxicas y no aptas para consumo humano. Comerlas puede provocar vómitos y calambres extremos. Se sabe que dosis altas han sido mortales. Aunque crudas son muy amargas y tánicas, una vez fermentadas producen un brebaje venenoso de sabor muy dulce, más conocido como "Vino de la Muerte". Recientemente, investigadores médicos estudian si la toxina podría servir para tratar daños nerviosos o enfermedades neurológicas.
items_commodities_thorium_desc=Un metal natural débilmente radiactivo. Se alea fácilmente con otros metales. Al exponerse al oxígeno, su superficie plateada se vuelve negra.
items_commodities_thrust_desc=Este cóctel químico proporciona al usuario una enorme dosis de energía, mayor sociabilidad, euforia y sensibilidad táctil intensificada. Al parecer desarrollado como base de bebida energética, esta droga es popular entre quienes buscan energía extra o "fiesta más larga". Sin embargo, por el riesgo de infarto, deshidratación mortal y convulsiones, está prohibida en la mayoría de zonas. Se reconoce a los usuarios por su habla entrecortada y divagante, piel enrojecida y sudoración.
vehicle_DescAEGS_Sabre_Raven_EX=Fabricante: Aegis Dynamics\nEnfoque: Interdicción\n\nAegis Dynamics ha subido el listón una vez más con su variante Raven. Casi tan rápida y maniobrable como su predecesora Sabre pero con menor firma, la Raven es una infiltrada veloz y sigilosa. Este modelo especial EX recupera parte de la capacidad ofensiva de la Sabre original e incorpora un amortiguador cuántico en el lomo para que los enemigos no escapen.
vehicle_DescARGO_MPUV_2951_BIS=Fabricante: Argo Astronautics\nEnfoque: Carga ligera\n\nLa MPUV Cargo de Argo Astronautics es una nave de transferencia mercante dedicada. Una ubicua estibadora intergaláctica: vastas cantidades de MPUV Cargo cargan y descargan mercancías de naves que no pueden aterrizar en planetas ni diques, como la Hull D y la Orion. Algunos capitanes la poseen y operan, otros prefieren contratar a operadores locales de Argo en los puertos más activos. Para celebrar que la MPUV Cargo fue finalista Best in Show 2951, esta edición luce una pintura especial azul y negra ya aplicada.
vehicle_DescARGO_Mole_Carbon=Fabricante: Argo Astronautics\nEnfoque: Minería media\n\nLa icónica extractora láser multioperador de Argo, más conocida como MOLE, trabaja más rápido y mejor que nunca gracias a su patentado sistema de minería trilateral. Tres estaciones articuladas independientes ofrecen máxima potencia y versatilidad casi ilimitada. La edición Carbon mantiene la reputada capacidad minera de la MOLE con un distintivo acabado totalmente negro.
vehicle_DescARGO_Mole_Talus=Fabricante: Argo Astronautics\nEnfoque: Minería media\n\nLa icónica extractora láser multioperador de Argo, más conocida como MOLE, trabaja más rápido y mejor que nunca gracias a su patentado sistema de minería trilateral. Tres estaciones articuladas independientes ofrecen máxima potencia y versatilidad casi ilimitada. La edición Talus ofrece la misma pericia minera que la nave estándar con una discreta piel gris.
vehicle_DescBANU_Merchantman=Fabricante: Banu\nEnfoque: Carga\n\nLos comerciantes banu son famosos por su destreza mercantil, viajan por las rutas y comercian con todo el que encuentran. Sus robustas naves mercantes han demostrado ser ideales para la tarea, tan apreciadas que pasan de generación en generación banu.
PU_ADVREP01_F_DEH_Succeed_MissionObj_VeryHardIsland_Siege_SecureArea_IG_001_TheAdminCenter=El Centro de administración ahora es 100 % seguro y está bajo control de la CDF.
Crus_HistMarker_Text_08=Situada sobre un cruce de múltiples cañones, Wolf Point obtuvo su nombre gracias a la topógrafa de Crusader Cally Stroble, quien había anotado con entusiasmo en su informe inicial que "contra todo pronóstico, parece que una familia de criaturas parecidas a lobos encontró una manera de establecerse en la zona. Sus aullidos se pueden escuchar a kilómetros a la redonda". Sin embargo, cuando una investigación más profunda demostró que los lobos eran simplemente una broma de un compañero topógrafo, el nombre perduró.
item_Desc_POWR_VNCL_S01_HellsHeart=Tipo de artículo: Planta de energía\nFabricante: Vanduul\nTamaño: 1\nGrado: N/A\nClase: Militar\n\nSe cree que la designación militar para esta planta de energía Vanduul se originó como una referencia hecha por un piloto bien educado de que los cazas Vanduul parecen estar "apuñalándonos desde el corazón del infierno".
Shubin_Industrial_HandMining_Intro_Local_Desc_001,P=PUBLICACIÓN: Orden de compra\nUBICACIÓN: <EM4>~mission(System) </EM4>\n\nPRUEBAS DE VISTA PREVIA TÉCNICA:\nCompleta esta misión para obtener planos de armas Volt. Para esta prueba, estos planos tienen algunos espacios que aceptan distintos materiales para ajustes variables de estadísticas.\n\n~mission(Hint_Location) Para una lista completa de dónde encontrar estos minerales, consulta <EM4>Fundamentos de minería #2: Dónde minar</EM4> en el diario de tu mobiGlas. Ya que estás allí, puedes leer también la primera parte, <EM4>Fundamentos de minería #1: Visión general básica</EM4>, si quieres refrescar cómo obtener los materiales.\n\nComo esto es una orden de compra y no un contrato minero, se espera que aportes tu propio equipo, como un <EM4>~mission(Hint_Tool)</EM4>.\n\nCuando estés listo para vendernos los materiales requeridos, deposítalos en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\n*Al aceptar este contrato asumes todos y cada uno de los riesgos asociados al trabajo aquí descrito y Shubin Interstellar no podrá ser considerada responsable de ningún daño acumulado durante la duración del contrato.\n\n<EM3>BLUEPRINTS POTENCIALES</EM3>\n<EM4>[Pyro]</EM4>\n- Pistola Arclight "Desert Shadow"\n- Pistola Arclight "Herrero"\n- Batería de Pistola Arclight (30 cap)\n- Traje de Exploración Novikov\n- Novikov (Casco)\n- Traje de Exploración Pembroke\n- Pembroke (Casco)\n\n<EM4>[Stanton]</EM4>\n- Pistola Arclight "Midnight"\n- Batería de Pistola Arclight (30 cap)\n- Strata (Brazos)\n- Strata (Coraza)\n- Strata Shooting Star (Casco)\n- Strata (Piernas)\n\n<EM3>DETALLES DE MISIÓN</EM3>\n<EM4>Tipo de misión:</EM4> Cadena, Inicial\n<EM4>Dificultad (1-7):</EM4> Combate 3/7 | Complejidad 3/7 | Riesgo 3/7 | Conocimiento 4/7\n<EM4>Neutro:</EM4> 100 Rep\n<EM4>Recompensa de blueprint:</EM4> Garantizado
Shubin_Industrial_ShipMining_Stanton_VE_Local_Desc_001,P=PUBLICACIÓN: Orden de compra\nUBICACIÓN: <EM4>~mission(System) </EM4>\n\nPRUEBAS DE VISTA PREVIA TÉCNICA:\nCompleta esta misión para obtener planos de un conjunto de armadura pesada Antium. Para esta prueba, estos planos tienen algunos espacios que aceptan distintos materiales para ajustes variables de estadísticas.\n\n\n~mission(Hint_Location) Para una lista completa de dónde encontrar estos minerales, consulta <EM4>Fundamentos de minería #2: Dónde minar</EM4> en el diario de tu mobiGlas. Ya que estás allí, puedes leer también la primera parte, <EM4>Fundamentos de minería #1: Visión general básica</EM4>, si quieres refrescar cómo obtener los materiales.\n\nComo esto es una orden de compra y no un contrato minero, se espera que aportes tu propio equipo, como un <EM4>~mission(Hint_Tool)</EM4>.\n\nTen en cuenta que, para agilizar el uso futuro de estos materiales, <EM4>deben estar refinados antes de la entrega</EM4>. Esto puede hacerse en cualquier refinería, cuyas ubicaciones pueden encontrarse en tu StarMap.\n\nCuando estés listo para vendernos los materiales refinados requeridos, deposítalos en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\n*Al aceptar este contrato asumes todos y cada uno de los riesgos asociados al trabajo aquí descrito y Shubin Interstellar no podrá ser considerada responsable de ningún daño acumulado durante la duración del contrato.\n\n<EM3>BLUEPRINTS POTENCIALES</EM3>\n<EM4>[Shubin_RG_ShipMining_Rank0]</EM4>\n- Pistola Arclight "Nightstalker"\n- Pistola Arclight "Warhawk"\n- Batería de Pistola Arclight (30 cap)\n- Aril (Brazos)\n- Aril (Coraza)\n- Aril Casco\n- Aril (Piernas)\n\n<EM4>[Shubin_RG_ShipMining_Rank0, Rango 0–1]</EM4>\n- Arbor MHV [Láser minero|S0]\n- Helix [Láser minero|S0]\n- Hofstede [Láser minero|S0]\n- Láser minero Lawson [Láser minero|S0]\n- Surveyor [Industrial|S2|C|Radar]\n- Surveyor-Go [Industrial|S0|C|Radar]\n- Surveyor-Lite [Industrial|S1|C|Radar]\n- Surveyor-Max [Industrial|S3|C|Radar]\n\n<EM3>DETALLES DE MISIÓN</EM3>\n<EM4>Tipo de misión:</EM4> Cadena\n<EM4>Dificultad (1-7):</EM4> Combate 3/7 | Complejidad 3/7 | Riesgo 3/7 | Conocimiento 3/7\n<EM4>Neutro:</EM4> 100 Rep\n<EM4>Recompensa de blueprint:</EM4> Garantizado
