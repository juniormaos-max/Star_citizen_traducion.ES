blackboxlegal_desc_0001=Una ~mission(Ship) ha desaparecido. Como aseguradora, ~mission(Contractor) necesita un contratista para revisar ~mission(Location) y localizar el ~mission(Item). ~mission(Timed)~mission(Danger)Una vez recuperado, el ~mission(Item) deberá devolverse a ~mission(Destination).
blackboxlegal_desc_0002=~mission(Contractor) está buscando un contratista para localizar una ~mission(Ship) accidentada y recuperar su ~mission(Item). ~mission(Timed)Deberás ir a ~mission(Location), extraer el ~mission(Item) y entregarlo en ~mission(Destination). ~mission(Danger)
blackboxlegal_desc_0003=Buscamos contratar a un operador independiente para recuperar un ~mission(Item) de una ~mission(Ship). ~mission(Timed) Deberás localizar ~mission(Location) y extraer el ~mission(Item) de la nave en cuestión. ~mission(Contractor) pagará al entregarlo en ~mission(Destination). ~mission(Danger)
blackboxlegal_desc_0004=~mission(Contractor) está buscando un contratista independiente para recuperar un ~mission(Item) de una ~mission(Ship). El asegurador proporcionará detalles de la ubicación en ~mission(Location). ~mission(Timed)El pago se emitirá una vez que la caja negra se entregue en ~mission(Destination). ~mission(Danger)
blackboxlegal_desc_0005=OPORTUNIDAD DE CONTRATO: Recuperar ~mission(Item)\nASEGURADORA: ~mission(Contractor) \nINSTRUCCIONES ADICIONALES: Se proporcionará la ubicación de ~mission(Location). ~mission(Timed)~mission(Danger)El cliente requiere que el contratista lo entregue en ~mission(Destination).
blackboxlegal_desc_0006=Un desafortunado incidente ha dejado inoperable una ~mission(Ship). En ~mission(Contractor) necesitamos que se recupere el ~mission(Item) de ~mission(Location) y se entregue en ~mission(Destination) para su procesamiento. ~mission(Timed)~mission(Danger)Solo solicitamos candidatos capaces. El pago es comparable a contratos similares.
blackboxlegal_from=~mission(Contractor)
blackboxlegal_timed_0002=Al parecer, esto es parte de una investigación mas amplia. ~mission(Contractor)Necesita que los datos del vuelo se recuperen rapidamente.
blackboxlegal_timed_0004=~mission(Contractor) esta ansioso por resolver este asunto lo antes posible y solicita una recuperación acelerada.
bounty_desc_0001=Recompensa emitida: ~mission(TargetName). Advertencia, se ha emitido una recompensa por ~mission(Contractor) por violar la ley imperial. Se ha autorizado el uso de la fuerza.
bounty_desc_0002=~mission(Contractor) busca un operador independiente para localizar y neutralizar a ~mission(TargetName). ~mission(Timed) ~mission(BountyDanger)
bounty_desc_0003=BUSCADO: ~mission(TargetName). Después de múltiples reincidencias en la violacion de la ley imperial, ~mission(Contractor) ha certificado y garantizado una recompensa para neutralizar al sospechoso por cualquier medio necesario.
bounty_desc_0004=PARA SU CIRCULACIÓN INMEDIATA: Se emitió una recompensa por ~mission(TargetName). Advertencia, el objetivo ha sido señalado como extremadamente peligroso, por lo que los operadores deben tener extrema precaución al enfrentarse con él. Esta recompensa ha sido certificada y garantizada por ~mission(Contractor). ~mission(Timed)
bounty_desc_0005=~mission(Contractor) ha emitido una recompensa por ~mission(TargetName). ~mission(Timed) ~mission(BountyDanger)
bounty_desc_0006=Parece que alguien se ha vuelto un poco demasiado alborotador. Hay una nueva recompensa de ~mission(Contractor) para eliminar a ~mission(TargetName). Siéntete libre de usar todos los recursos disponibles en este caso. ~mission(Timed) ~mission(BountyDanger)
bounty_desc_0007=Buscando un contratista independiente para ejecutar una recompensa. El nombre del objetivo es ~mission(TargetName). El bono está certificado por ~mission(Contractor). ~mission(Timed) ~mission(BountyDanger)
bounty_location_0002=Si es aceptado, ~mission(Contractor) proporcionará datos de ubicación relevantes para ~mission(TargetName|Last).
