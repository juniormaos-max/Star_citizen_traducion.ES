hurston_sectorsweep_desc_001=DINÁMICA HURSTON\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Eliminar Amenaza del Espacio Controlado por Hurston\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: ~mission(Contractor|Auth)\nEVALUACIÓN DE RIESGOS: ~mission(Contractor|Danger)\nCONTRATO URGENTE: ~mission(Contractor|Timed)\n\nDinámica Hurston busca contratistas independientes para eliminar la presencia de ~mission(Contractor|Target) que opera cerca de ~mission(Location|Address). Todos los medios pacíficos para forzarlos a abandonar la zona han sido ignorados. Si son avistados, es probable que los perpetradores se resistan violentamente, así que prepárate en consecuencia. Los contratistas deben proporcionar su propia nave y suministros necesarios para completar la tarea.\n\nAl aceptar este contrato, aceptas comenzar el trabajo de inmediato. El pago se emitirá una vez que Hurston considere el contrato completo.\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o acción basados en esta información por parte de personas o entidades distintas al destinatario previsto están prohibidos. **
hurston_sectorsweep_desc_002=DINÁMICA HURSTON\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Eliminar Amenaza del Espacio Controlado por Hurston\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: ~mission(Contractor|Auth)\nEVALUACIÓN DE RIESGOS: ~mission(Contractor|Danger)\nCONTRATO URGENTE: ~mission(Contractor|Timed)\n\nSe necesitan contratistas de seguridad para someter a una creciente presencia de ~mission(Contractor|Target) alrededor de ~mission(Location|Address). Todos los puntos relevantes de patrulla y escaneo serán proporcionados por el departamento de logística de Hurston. Se sabe que estos sospechosos son delincuentes violentos, así que asume que responderán de manera agresiva si son avistados.\n\nAl aceptar este contrato, aceptas comenzar el trabajo de inmediato. El pago se emitirá una vez que Hurston considere neutralizada la amenaza.\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o acción basados en esta información por parte de personas o entidades distintas al destinatario previsto están prohibidos. **
hurston_sectorsweep_desc_003=DINÁMICA HURSTON\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Eliminar Amenaza del Espacio Controlado por Hurston\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: ~mission(Contractor|Auth)\nEVALUACIÓN DE RIESGOS: ~mission(Contractor|Danger)\nCONTRATO URGENTE: ~mission(Contractor|Timed)\n\nLas áreas cerca de ~mission(Location|Address) se han vuelto cada vez más peligrosas últimamente debido a la presencia de ~mission(Contractor|Target). Hurston Dynamics necesita un contratista fiable para patrullar la zona y eliminar cualquier fuerza hostil. Cuando se localicen los objetivos, ejerce extrema precaución, ya que se sabe que responden violentamente cuando se les enfrenta.\n\nAl aceptar este contrato, aceptas comenzar el trabajo de inmediato. El pago se emitirá una vez que Hurston considere el sector despejado.\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o acción basados en esta información por parte de personas o entidades distintas al destinatario previsto están prohibidos. **
kareahsweep_desc_0002=El sistema de seguridad en ~mission(Location) acaba de ser activado por intrusos identificados como miembros de ~mission(Client). Permíteme decirte desde mi experiencia personal, que estos son unos desalmados muy serios. Como puedes imaginar, ~mission(Contractor) está bastante ansioso por contratar a un equipo para ir y eliminarlos. ~mission(CombatPay)\n\nSi estás interesado, apúrate y toma el equipo que necesitarás. Sería genial si pudiéramos resolver todo esto lo más rápido y seguramente posible.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K
kareahsweep_from=~mission(Contractor)
mg_clovus_bladesteal_desc_002=Logré interceptar una noticia interesante que venía por las comunicaciones. Parece que la fortuna de Hurston está cayendo literalmente; uno de sus satélites se ha estrellado en la superficie. Sin embargo, no todo está perdido, ya que el valioso ~mission(Item) a bordo parece haber sobrevivido al impacto.  \n\nAhora, este es uno de esos momentos en los que individuos emprendedores enfrentan una elección. O no haces nada, dejas que Hurston recupere su propiedad y dejas que este mundo miserable siga girando, o aprovechas la oportunidad para capitalizar. Personalmente, me inclino hacia lo último y espero que tú también sientas lo mismo. \n\nSi lograras obtener la pieza de ~mission(location) antes que Hurston, estoy seguro de que podría encontrar a algunas partes interesadas en pagar generosamente por un vistazo anticipado al arduo trabajo de Hurston.\n\nLa única condición (como siempre) es que, para descifrar y extraer los datos de manera segura, debes conectarlo a un servidor oficial de Hurston antes de que sus protocolos de seguridad provoquen su autodestrucción. Recomiendo usar un terminal de datos de las instalaciones de almacenamiento. Suelen ser más fáciles de acceder que cualquier cosa que se pueda encontrar en Lorville. Una vez completada la transferencia, emitiré tus merecidas recompensas.\n\nLa mejor de las suertes,\n\n-cd\n\n~mission(Update)
mg_klim_deliver_drug_desc_0005=He escuchado rumores de que el Grupo Otoni está tratando de infiltrarse en el mercado narco de aquí. Han estado tratando de vender productos de baja calidad al doble del precio. Ahora he encontrado un nuevo sintético que puedo agregar a mi ~mission(Item) que no solo hace que sea más barato de cocinar, sino que también añade un gancho impresionante al subidón. Con mis productos, todos ganan. Excepto los Otoni. \n\nHe preparado una muestra y necesito que la lleves a ~mission(destination). Mi equipo se encargará del resto. ~mission(Contractor|Danger)Después de eso, te pagan. ~mission(Contractor|Timed)\n\n- Wallace
mg_miles_groupbounty_desc_001=TIPO DE CONTRATO: Orden de Grupo\nESTADO DEL CONTRATISTA: Independiente\nCódigo de Aprobación: = ~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\nEn relación con un crimen cometido conjuntamente, se ha emitido una orden de grupo para:\n    ~mission(Target1)\n    ~mission(Target2)\n    ~mission(Target3)\n\nActualmente se cree que ya no viajan juntos para evadir la captura, y pronto podrían huir del sistema. Debería considerar seriamente reclutar ayuda adicional para ejecutar todas las órdenes dentro del marco de tiempo limitado.\n\nSe le autoriza a utilizar la fuerza necesaria para neutralizar a los objetivos.\n\nEl pago se emitirá tras la finalización exitosa del contrato cuando todos los objetivos hayan sido tratados dentro del tiempo asignado.\n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, propietaria, privilegiada y/o privada. La información está destinada para el uso del individuo o entidad designada anteriormente.\n\n<EM3>DETALLES DE MISION</EM3>\n<EM4>Tipo de encuentro:</EM4> Nave\n<EM4>Tipo de misión:</EM4> Estándar\n<EM4>Rep:</EM4> 500
mg_ruto_planetcollect_waste_obj_long_01=Ve a ~mission(Location01|Address).
outlawsweep_desc_0002=Se ha identificado a forajidos como miembros de la Banda ~mission(Client) que se han infiltrado en ~mission(Location). Los hemos estado buscando durante un tiempo, así que como puedes imaginar, ~mission(Contractor) está bastante ansioso por reunir un equipo para lidiar con ellos. ~mission(CombatPay)\n\nSi estás interesado, toma el equipo que necesitarás y ponte en marcha. Sería genial si pudiéramos resolver todo esto lo más rápido y seguramente posible.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K
outpost_repair_from=~mission(Contractor)
