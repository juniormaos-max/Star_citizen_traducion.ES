RepairOxygenKiosk_DescriptionLong_Location=Hola Invitados,\n\nRecientemente nos alertaron de que uno de nuestros Dispensadores de Oxígeno ha experimentado un error técnico. Como saben, estos puestos son vitales para asegurarse de que tengan suficiente oxígeno a mano mientras participan en nuestro Programa de Liberación Laboral.\n\nEstamos buscando a cualquier invitado disponible para llegar a ~mission(Route), ~mission(Depth) y reiniciar el puesto. Eso debería reconectar el puesto a la red y resolver el problema. El primer invitado que logre completar esta tarea no solo será compensado con méritos, sino también con la satisfacción de estar haciendo el lugar de trabajo más seguro para otros invitados.\n\nGracias.
