searchbody_desc_0001=La familia de ~mission(TargetName) espera encontrar algún cierre. Aunque hay confirmación de que la ~mission(Ship) en la que ~mission(TargetName|First) servía no sobrevivió a su viaje, la familia quiere saber con certeza qué sucedió. ~mission(Contractor) está buscando a alguien con tacto y discreción para investigar ~mission(Location) y averiguar el destino de ~mission(TargetName|First). ~mission(Timed)~mission(Danger) Se agradece su ayuda en el asunto.
searchbody_desc_0002=Recientemente, una ~mission(Ship) tuvo mala suerte y fue destruida. Desde aproximadamente ese mismo momento, nadie ha escuchado ni visto a ~mission(TargetName) y nuestra creencia actual es que podrían haber estado a bordo cuando la ~mission(Ship) encontró su destino. Estamos buscando un contratista para realizar un reconocimiento en el lugar en ~mission(Location) y determinar si ~mission(TargetName|Last) está allí. ~mission(Timed)~mission(Danger)
searchbody_desc_0003=Necesitamos un contratista para localizar a ~mission(TargetName), quien fue visto por última vez trabajando a bordo de una ~mission(Ship) que fue reportada como destruida recientemente. ~mission(Timed)~mission(Danger) El pago se realizará al recibir la confirmación del paradero de ~mission(TargetName|Last).
searchbody_desc_0004=~mission(Contractor) está buscando actualmente a un contratista para ayudar a confirmar el estado de ~mission(TargetName). Según nuestra investigación inicial, se cree que ~mission(TargetName|First) estaba sirviendo a bordo de una ~mission(Ship) que sufrió un trágico accidente. Requeriríamos que viajes a ~mission(Location) y realices una búsqueda en el lugar, para que podamos determinar si ~mission(TargetName|First) pereció a bordo e informar a los padres. ~mission(Timed)~mission(Danger)
searchbody_desc_0005=No esperamos un resultado feliz en este caso. ~mission(TargetName) fue escuchado por última vez cuando abordó una ~mission(Ship). Esa misma nave fue reportada como destruida. Ahora, la familia quiere confirmar lo que sucedió de una u otra manera. Ahí es donde entras tú. Ve, busca en ~mission(Location), localiza a ~mission(TargetName|Last) y esperamos poder darles un poco de tranquilidad. ~mission(Timed)~mission(Danger)
searchbody_from=~mission(Contractor)
searchcrew_danger_0002=Va sin decir, pero ten cuidado ahí afuera. Odiaríamos que lo que le sucedió a la ~mission(Ship) le ocurriera a ti.
searchcrew_danger_0003=Es posible que la ~mission(Ship) haya sido víctima de juego sucio, así que tómate tu tiempo y no te descuides. La precaución es la palabra clave.
searchcrew_desc_0001=Los familiares de la tripulación que servía a bordo de una ~mission(Ship) que recientemente fue reportada como destruida esperan encontrar algún cierre. ~mission(Contractor) está buscando contratistas para investigar ~mission(Location) y ver si pueden descubrir el destino de la tripulación. ~mission(Timed)~mission(Danger) Tu ayuda en el asunto es muy apreciada.
searchcrew_desc_0002=Recientemente, una ~mission(Ship) tuvo mala suerte y fue destruida. Desde ese desafortunado incidente, nadie ha escuchado o visto a ningún miembro de la tripulación, y nuestra creencia actual es que ninguno pudo haber sobrevivido. Estamos buscando contratistas para realizar un reconocimiento en el lugar en ~mission(Location) e identificar positivamente a todos los miembros de la tripulación desaparecidos. ~mission(Timed)~mission(Danger)
searchcrew_desc_0003=Necesitamos contratistas para localizar a la tripulación desaparecida de una ~mission(Ship) que fue reportada recientemente como destruida. ~mission(Timed)~mission(Danger) El pago se realizará al recibir la confirmación del paradero del complemento completo.
searchcrew_desc_0004=~mission(Contractor) está buscando actualmente contratistas para ayudar a confirmar el estado de la tripulación a bordo de una ~mission(Ship) que sufrió un trágico accidente. Te requeriríamos viajar a ~mission(Location) y realizar una búsqueda en el lugar en nuestro nombre para que podamos determinar qué sucedió con la tripulación desaparecida e informar a los familiares. ~mission(Timed)~mission(Danger)
searchcrew_desc_0005=No esperamos un resultado feliz en este caso. Se informó que una ~mission(Ship) fue destruida y ahora la familia de la tripulación quiere confirmar lo que sucedió de una u otra manera. Necesitamos contratistas para buscar en ~mission(Location), localizar a todas las personas desaparecidas, para que podamos darles a sus familiares un poco de tranquilidad. ~mission(Timed)~mission(Danger)
searchcrew_from=~mission(Contractor)
searchcrew_location_0003=la última posición conocida de la ~mission(Ship)
searchcrew_location_0008=los restos de la ~mission(Ship)
sectorsweep_desc_0001=El ~mission(Client) ha estado operando de manera agresiva en ~mission(Location) y, después de su ataque más reciente, las autoridades locales han decidido que es suficiente. ~mission(Contractor) está buscando operadores para dirigirse inmediatamente al punto de encuentro y comenzar a barrer todo el sector, eliminando a cualquier ~mission(Client) que encuentren. ~mission(Jingo)~mission(Danger)
spacecargo_illegal_from=~mission(Contractor)
spacecargo_legal_desc_0001=El ~mission(Contractor) perdió una nave en tránsito y necesita recuperar un envío específico de ~mission(Item) de los restos. Si aceptas, deberás extraer el ~mission(Item) de forma segura de ~mission(Location|Address) y entregarlo a ~mission(Destination). ~mission(Timed)~mission(Danger)
spacecargo_legal_desc_0002=¿Puede alguien allá fuera ayudarme? Una nave que contraté para transportar una entrega muy importante fue atacada en su camino hacia ~mission(Destination). Necesito que alguien vaya a ~mission(Location|Address) y recupere el envío de ~mission(Item). ~mission(Timed)El trabajo estará garantizado a través de ~mission(Contractor), así que no tienes que preocuparte por ser estafado. Solo tráelo a ~mission(Destination) y te pagarán. Simple. ~mission(Danger)
spacecargo_legal_desc_0003=Un transporte de ~mission(Ship) fue atacado y destruido antes de llegar a su destino final. Las autoridades locales han sido notificadas, pero el cliente aún requiere la entrega de su paquete de ~mission(Item), por lo que necesitamos a alguien que extraiga el envío de ~mission(Location|Address) y complete la entrega prevista a ~mission(Destination). ~mission(Timed)~mission(Danger)
spacecargo_legal_desc_0004=~mission(Contractor) está buscando contratar a un piloto independiente para un trabajo de recuperación. Se perdió un ~mission(Ship) en tránsito, por lo que se te asignará la tarea de navegar hasta ~mission(Location|Address) y extraer una caja de ~mission(Item) de los restos. Luego deberás entregar el envío a ~mission(Destination). El pago se realizará al momento de la entrega.\n\n~mission(Timed)\n\n~mission(Danger)
spacecargo_legal_desc_0005=Debido a circunstancias desafortunadas, una nave de carga se perdió durante el tránsito por el sistema. Sin embargo, ~mission(Contractor) requiere que se recupere una caja específica de ~mission(Item) de ~mission(Location|Address) y se entregue a ~mission(Destination). ~mission(Timed)Una vez que el envío se haya entregado de manera segura, tu pago se transferirá de inmediato. ~mission(Danger)
spacecargo_legal_desc_0006=~mission(Contractor) necesita un piloto independiente para un trabajo de recuperación en un Lugar de restos de una ~mission(Ship). Se te asignará la tarea de encontrar y extraer un envío de ~mission(Item) de ~mission(Location|Address) y entregarlo a su destino previsto en ~mission(Destination). ~mission(Timed)~mission(Danger)El pago se transferirá inmediatamente tras la finalización exitosa. \n\nEste trabajo ha sido garantizado a través de ~mission(Contractor).
spacecollect_cargo_from=~mission(Contractor)
dfm_ui_Countermeasures_Reminder=Para disparar una contramedida mantenga [~action(spaceship_defensive|v_weapon_launch_countermeasure)].
dfm_ui_FiringWeapons=Para disparar el grupo de armas 1, mantenga presionado [~action(spaceship_weapons|v_attack1_group1) ], para disparar arma grupo 2 mantenga [~action(spaceship_weapons|v_attack1_group2)].\nEn tu nave de entrenamiento el grupo 1 es un arma balística y el grupo 2 son dos armas de energía.
dfm_ui_FreeLook_Mouse_Reminder=Freelook se puede alternar manteniendo [~action(spaceship_view|v_view_freelook_mode)]. Mientras Freelook esté activado no podrás pilotar tu nave.
dfm_ui_FreeLook_Other=Para mirar alrededor de su cabina, presione [~action(spaceship_targeting|v_aim_yaw)] en la dirección a la que quiera mirar. Tras un breve tiempo sin entrada, su vista volverá al centro.
dfm_ui_FreeLook_Pad_Reminder=Freelook se puede alternar manteniendo [~action(spaceship_view|v_view_freelook_mode)]. Mientras Freelook esté activado no podrás pilotar tu nave.
dfm_ui_MissileFiring_Reminder=Para bloquear un misil, presione [~action(spaceship_targeting|v_target_missile_lock_focused) ] .\n Para disparar misiles bloqueados mantenga [~action(spaceship_missiles|v_weapon_launch_missile)].
dfm_ui_Movement_Mouse=Cuando este a pie, mantenga presionado [~action(player|moveforward) ] caminar hacia adelante, [~action(player|moveback)] para caminar hacia atrás, [~action(player|moveleft)] para caminar a la izquierda y [~action(player|moveright)] para caminar a la derecha.
dfm_ui_Rolling_Mouse=Usted es capaz de rodar su nave izquierda manteniendo [~action(spaceship_movement|v_roll_left)] y a la derecha manteniendo [~action(spaceship_movement|v_roll_right)].
dfm_ui_Rolling_Other=Eres capaz de rodar tu nave sosteniendo [~action(spaceship_movement|v_roll)].
dfm_ui_ShipPane=Presionando [~action(spaceship_hud|v_hud_interact_toggle)] le permitira interactuar con el HUD haciendo aparecer un cursor que le permitira seleccionar componentes especificos, puede navegar por el HUD usando [~action(spaceship_hud|v_hud_left_panel_up) ] y seleccione con [~action(spaceship_hud|v_hud_confirm)].\nHay 4 paneles de información disponibles: OVR (general) [~action(spaceship_hud|v_hud_open_tab1)], WEAP (armas) [~action(spaceship_hud|v_hud_open_tab2)], PWR (energía) [~action(spaceship_hud|v_hud_open_tab3)] y SHLD (escudos) [~action(spaceship_hud|v_hud_open_tab4)].\nCada panel se puede cambiar hacia adelante con [~action(spaceship_hud|v_hud_focused_cycle_mode_fwd)] y hacia atrás con [~action(spaceship_hud|v_hud_focused_cycle_mode_back)].\nPulse [~action(spaceship_hud|v_hud_interact_toggle)] cuando quiera salir del modo de interacción con el HUD.
dfm_ui_ShipPane_Pad=Presionando [~action(spaceship_hud|v_hud_interact_toggle)] le permitira interactuar con el HUD haciendo aparecer un cursor que le permitira seleccionar componentes especificos, puede navegar por el HUD usando [~action(spaceship_hud|v_hud_left_panel_up) ] y seleccione con [~action(spaceship_hud|v_hud_confirm)].\nHay 4 paneles de información disponibles: OVR (general), WEAP (armas), PWR (energía) y SHLD (escudos).\nCada panel se puede cambiar hacia adelante con [~action(spaceship_hud|v_hud_focused_cycle_mode_fwd)] y hacia atrás con [~action(spaceship_hud|v_hud_focused_cycle_mode_back)].\nPulse [~action(spaceship_hud|v_hud_interact_toggle)] cuando quiera salir del modo de interacción con el HUD.
dfm_ui_Strafing_Other=Maniobrar es mover tu nave usando solo tus propulsores de maniobra. Para Acelerar, mantenga presionado [~action(spaceship_movement|v_strafe_up)], abajo [~action(spaceship_movement|v_strafe_down) ], izquierda [~action(spaceship_movement|v_strafe_left)] y derecha [~action(spaceship_movement|v_strafe_right)].\nPara maniobrar hacia adelante mantenga [~action(spaceship_movement|v_strafe_forward)] y hacia atrás [~action(spaceship_movement|v_strafe_back)].\nManiobrar se usa sobre todo a velocidades lentas para hacer los ajustes precisos necesarios al moverse en espacios reducidos como hangares o zonas de aterrizaje, pero los pilotos expertos también la usan para evitar fuego entrante o esquivar obstáculos.
dfm_ui_Strafing_Other_Reminder=Para Acelerar, mantenga presionado [~action(spaceship_movement|v_strafe_up)], abajo [~action(spaceship_movement|v_strafe_down) ], izquierda [~action(spaceship_movement|v_strafe_left)] y derecha [~action(spaceship_movement|v_strafe_right)].\nPara maniobrar hacia adelante mantenga [~action(spaceship_movement|v_strafe_forward)] y hacia atrás [~action(spaceship_movement|v_strafe_back)].
dfm_ui_Strafing_Pad=Maniobrar es mover tu nave usando solo tus propulsores de maniobra. Hay seis direcciones en las que todos las naves pueden Maniobrar. \nPara Maniobrar hacia arriba o hacia abajo use [~action(spaceship_movement|v_strafe_vertical) ]. \nTo Maniobrar hacia adelante o atrás usar [~action(spaceship_movement|v_strafe_longitudinal)].\nY para maniobrar a izquierda o derecha use [~action(spaceship_movement|v_strafe_lateral)].\nManiobrar se usa sobre todo a velocidades lentas para hacer los ajustes precisos necesarios al moverse en espacios reducidos como hangares o zonas de aterrizaje, pero los pilotos expertos también la usan para evitar fuego entrante o esquivar obstáculos.
dfm_ui_Strafing_Pad_Reminder=Para Maniobrar hacia arriba o hacia abajo usa [~action(spaceship_movement|v_strafe_vertical)].\nPara maniobrar hacia adelante o hacia atrás usa [~action(spaceship_movement|v_strafe_longitudinal)].\nY para maniobrar a izquierda o derecha usa [~action(spaceship_movement|v_strafe_lateral)].
