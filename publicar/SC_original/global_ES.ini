PU_NPCVP5_BDC_ResponseStanton_IG_001,P=Conocí a alguien en el puerto espacial de Teasa que me ofreció buenos créditos por llevarle su mochila a un amigo en Lorville. Supongo que tenía prisa y necesitaba reparar el casco de su nave. La rechacé porque me dio mala espina, pero ahora me pregunto si dejé pasar un dinero fácil.
