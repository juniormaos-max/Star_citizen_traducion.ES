deployprobe_danger_0001=Ten en cuenta que  ~mission(Contractor) no es responsable de los posibles contactos hostiles que puedas encontrar durante la duración de este contrato.
deployprobe_desc_0001=El ~mission(Contractor) busca recopilar más datos de ~mission(Destination). Para ayudar en este esfuerzo, estamos buscando un contratista para desplegar un ~mission(Item) allí. ~mission(Contractor|DeployProbeDanger)
deployprobe_desc_0002=Para ampliar la comprensión del sistema por parte del ~mission(Contractor), esperamos que se despliegue un ~mission(Item) para recopilar información. Después de recoger el ~mission(Item) de ~mission(Location), serás responsable de transportarlo a ~mission(Destination|Address) y activarlo. ~mission(Contractor|DeployProbeDanger)
deployprobe_desc_0003=Temos un ~mission(Item) esperando en ~mission(Location) para ser recogido. Luego, transportarás y desplegarás el ~mission(Item) en ~mission(Destination|Address). ~mission(Contractor|DeployProbeDanger) Cualquier contratista interesado en ayudarnos con esta tarea debería informar al ~mission(Contractor) tan pronto como sea posible.
deployprobe_desc_0004=Recientemente, nuestros sensores de largo alcance detectaron algunas lecturas anómalas de ~mission(Destination|Address). Para comprenderlas mejor, el ~mission(Contractor) está contratando a un contratista para desplegar un ~mission(Item) en el lugar. ~mission(Contractor|DeployProbeDanger)
