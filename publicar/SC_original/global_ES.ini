planetcollect_illegalwaste_stops_0001=El paquete en cuestión estará esperándote en ~mission(Location01|Address).
planetcollect_illegalwaste_stops_0002=De todos modos, recoge el paquete de ~mission(Location01|Address) y déjalo donde sea.
planetcollect_illegalwaste_stops_0003=Y en caso de que te lo estés preguntando, la recogida es en ~mission(Location01|Address).
planetcollect_legal_desc_0008=Recién recibimos una solicitud de ~mission(Client) -\n\nPARA: ~mission(Contractor)\nDE: ~mission(Client)\n'Tenemos ~mission(Item) que nos gustaría que recojan y lleven a ~mission(Destination). ~mission(Timed) ¡Gracias!'\n\nNecesitamos una nave cerca de ~mission(Location) para manejar la entrega. Tarifas competitivas. Experiencia previa como mensajero o en entregas es una ventaja.
planetcollect_legal_from=~mission(Contractor)
planetcollect_meds_from=~mission(Contractor)
planetcollect_ore_from=~mission(Contractor)
planetcollect_oresamp_desc_0007=Buscando contratar una nave para entregar un pedido desde ~mission(Location) hasta ~mission(Destination). ~mission(TimedPay) pago no es negociable. Se espera que la nave proporcione su propio seguro.
planetcollect_oresamp_desc_0008=Acabo de programar una recogida por parte de ~mission(Client) -\n\nPARA: ~mission(Contractor)\nDE: ~mission(Client)\n'Tenemos una caja con ~mission(Item) que necesitamos llevar a ~mission(Destination). ~mission(Timed)¡Gracias!'\n\nNecesitamos una nave en la zona para manejar la entrega. Tarifas competitivas. Experiencia previa como mensajero o en entregas es una ventaja.
